name: Prepare es.stackoverflow data 26-27

on:
  workflow_dispatch:

jobs:
  prepare-es-stackoverflow-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install preprocessing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl parallel p7zip-full

      - name: Download and preprocess source data
        working-directory: es.stackoverflow/preprocess
        env:
          FORCE_DOWNLOAD: '1'
        run: sh preprocess.sh

      # Which dump this release was built from.  It is published with the
      # release and committed at the end, so the repository records it too.
      # The workflows that copy the release into the repository
      # (update-repo-parquet.yml, update-jsonl-sample.yml) compare it with the
      # dump they built from last time and skip the run when it is the same.
      - name: Record the source dump
        working-directory: es.stackoverflow/preprocess
        run: |
          python3 - <<'EOF'
          import hashlib
          import json
          from pathlib import Path

          archive = Path("data/es.stackoverflow.com.7z")
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              while chunk := stream.read(1 << 20):
                  digest.update(chunk)
          source = {
              "url": Path("URL").read_text().splitlines()[0],
              "sha256": digest.hexdigest(),
              "bytes": archive.stat().st_size,
          }
          Path("../source.json").write_text(
              json.dumps(source, indent=2, sort_keys=True) + "\n"
          )
          EOF

      - name: Install Parquet conversion dependencies
        run: python -m pip install --disable-pip-version-check -r es.stackoverflow/preprocess/requirements.txt

      - name: Convert CSV files to Parquet
        working-directory: es.stackoverflow/preprocess
        run: python csvtoparquet.py --input-dir data --output-dir data

      - name: Validate CSV to Parquet conversion
        working-directory: es.stackoverflow/preprocess
        run: python validate_conversion.py --input-dir data --output-dir data

      - name: Compress each CSV with gzip
        working-directory: es.stackoverflow/preprocess
        run: gzip --keep --best data/*.csv

      - name: Package Parquet files
        working-directory: es.stackoverflow/preprocess
        run: |
          set -eu
          tar -czf es.stackoverflow.parquet.tar.gz -C data \
            Posts.parquet Votes.parquet Users.parquet Tags.parquet Comments.parquet

      - name: Package processed XML and CSV files
        working-directory: es.stackoverflow/preprocess
        run: |
          set -eu
          tar -czf es.stackoverflow.xml.tar.gz -C data \
            Posts.xml Votes.xml Users.xml Tags.xml Comments.xml
          tar -czf es.stackoverflow.csv.tar.gz -C data \
            Posts.csv Votes.csv Users.csv Tags.csv Comments.csv

      - name: Upload data release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: es.stackoverflow.data-26-27
          name: es.stackoverflow.data-26-27
          files: |
            es.stackoverflow/preprocess/es.stackoverflow.xml.tar.gz
            es.stackoverflow/preprocess/es.stackoverflow.csv.tar.gz
            es.stackoverflow/preprocess/data/*.csv.gz
            es.stackoverflow/preprocess/data/*.parquet
            es.stackoverflow/source.json
            es.stackoverflow/preprocess/es.stackoverflow.parquet.tar.gz

      # Only after the release is published, so the repository never names a
      # dump that has no release.
      - name: Commit the source dump record
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add es.stackoverflow/source.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record the source dump of es.stackoverflow.data-26-27 - $(date +'%Y-%m-%d')."
            git push origin main
          fi
