name: Update JSONL sample

on:
  schedule:
    # Run on the first day of every month at 4:00 AM UTC.  It reads the data
    # release and does nothing unless that release comes from a different
    # Stack Exchange dump than the sample in the repository.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the release comes from the same dump as the current files'
        type: boolean
        default: false

jobs:
  update-jsonl-sample:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow the workflow to write to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from config
        id: read_version
        run: |
          VERSION=$(grep '^version:' .github/config.yml | cut -d'"' -f2)
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install conversion dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r es.stackoverflow/preprocess/requirements.txt

      - name: Set up Git configuration
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # Downloads the Parquet assets of the data release and writes
      # es.stackoverflow/jsonl/, unless es.stackoverflow/source.json names the
      # dump the sample already comes from: then nothing is rebuilt and there
      # is nothing to commit.
      - name: Build the JSONL sample
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: make -C es.stackoverflow jsonl

      - name: Add the sample to git
        run: git add es.stackoverflow/jsonl

      - name: Commit and push changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update es.stackoverflow JSONL sample - $(date +'%Y-%m-%d')."
            git push origin main
          fi

      # The committed copy is what a web page can fetch (release assets send
      # no CORS headers); the release is for downloads, curl and mongoimport.
      - name: Upload as release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: jsonl-sample-${{ steps.read_version.outputs.tag }}
          name: jsonl-sample-${{ steps.read_version.outputs.tag }}
          files: |
            es.stackoverflow/jsonl/*.jsonl.gz
            es.stackoverflow/jsonl/manifest.json
