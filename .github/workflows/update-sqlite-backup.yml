name: Update SQLite Backup

on:
  schedule:
    # Run on the first day of every month at 2:00 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-sqlite-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow the workflow to write to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from config
        run: |
          VERSION=$(grep '^version:' .github/config.yml | cut -d'"' -f2)
          echo "IMAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate SQLite backup
        run: |
          cd es.stackoverflow
          # Concatenate and decompress the split xz files, then recompress with gzip
          cat es.stackoverflow.db.xz.00 es.stackoverflow.db.xz.01 | xz -d | gzip -9 > es.stackoverflow.db.gz

      - name: Upload as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sqlite-backup-${{ env.IMAGE_VERSION }}
          files: es.stackoverflow/es.stackoverflow.db.gz
